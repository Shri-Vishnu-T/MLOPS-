stages:
  validation:
    cmd: .venv\Scripts\python.exe scripts\run_validation.py
    deps:
      - data/raw/loan/loan_data.csv
      - data/raw/credit_limit/default of credit card clients.xls
      - scripts/run_validation.py
      - src/data/load_data.py
      - src/data/validate_loan_data.py
      - src/data/validate_credit_data.py
      - params.yaml
    params:
      - validation.minimum_age
      - validation.maximum_age
    metrics:
      - reports/metrics/validation_metrics.json:
          cache: false

  preprocessing:
    cmd: .venv\Scripts\python.exe scripts\run_preprocessing.py
    deps:
      - data/raw/loan/loan_data.csv
      - data/raw/credit_limit/default of credit card clients.xls
      - scripts/run_preprocessing.py
      - src/data/load_data.py
      - src/data/validate_loan_data.py
      - src/data/validate_credit_data.py
      - src/features/preprocess_loan.py
      - src/features/preprocess_credit.py
      - params.yaml
    params:
      - project.random_seed
      - data_split.test_size
      - validation.minimum_age
      - validation.maximum_age
      - currency.exchange_rate
    outs:
      - data/processed/loan
      - data/processed/credit_limit

  training:
    cmd: >-
      .venv\Scripts\python.exe scripts\export_final_models.py
      --allow-training-fallback
    deps:
      - data/processed/loan
      - data/processed/credit_limit
      - scripts/export_final_models.py
      - src/models/final_artifacts.py
      - src/models/train_loan_baseline.py
      - src/models/train_credit_baseline.py
      - src/tracking/mlflow_utils.py
      - reports/mlflow_experiment_report.md
      - params.yaml
    params:
      - project.random_seed
      - data_split.test_size
      - xgboost_training
      - mlflow
      - serving
    outs:
      - models/final/loan_xgboost_pipeline.joblib
      - models/final/credit_limit_xgboost_pipeline.joblib
    metrics:
      - reports/metrics/model_export.json:
          cache: false

  evaluation:
    cmd: .venv\Scripts\python.exe scripts\evaluate_final_models.py
    deps:
      - data/raw/loan/loan_data.csv
      - data/raw/credit_limit/default of credit card clients.xls
      - data/processed/loan
      - data/processed/credit_limit
      - models/final/loan_xgboost_pipeline.joblib
      - models/final/credit_limit_xgboost_pipeline.joblib
      - scripts/evaluate_final_models.py
      - src/evaluation/evaluate_classification.py
      - src/evaluation/evaluate_regression.py
      - src/models/final_artifacts.py
      - src/tracking/mlflow_utils.py
      - params.yaml
    params:
      - project.random_seed
      - data_split.test_size
      - serving
      - dvc.loan_metrics_path
      - dvc.credit_metrics_path
    metrics:
      - reports/metrics/loan_metrics.json:
          cache: false
      - reports/metrics/credit_limit_metrics.json:
          cache: false
