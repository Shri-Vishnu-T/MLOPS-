[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-loan-mlops"
version = "0.1.0"
description = "Loan approval prediction and credit limit recommendation using MLOps practices."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.4,<2.0",
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "PyYAML>=6.0,<7.0",
    "scikit-learn>=1.5,<2.0",
    "mlflow>=3.14,<4.0",
    "xgboost>=3.2,<3.3",
    "dvc>=3.67,<4.0",
    "fastapi>=0.139,<1.0",
    "uvicorn>=0.51,<1.0",
    "prometheus-client>=0.25,<1.0",
    "xlrd>=2.0.1,<3.0",
]

[project.optional-dependencies]
notebook = [
    "jupyterlab>=4.2,<5.0",
    "matplotlib>=3.9,<4.0",
    "seaborn>=0.13,<1.0",
]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.6,<1.0",
    "httpx>=0.28,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
